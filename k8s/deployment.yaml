apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-details
  labels:
    app: product-details
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-details
  template:
    metadata:
      labels:
        app: product-details
    spec:
      containers:
        - name: product-details-web
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
